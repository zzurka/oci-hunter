name: OCI A1 capacity hunt

on:
  schedule:
    # Svakih 30 minuta, 03:00-09:00 UTC = 05:00-11:00 po nasem vremenu (najbolji prozor).
    # ~14 pokretanja dnevno, oko 1300 min/mesec - staje u besplatnu kvotu privatnog repoa.
    # Ako je repo javan (neograniceni minuti), slobodno stavi: '*/10 * * * *'
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-capacity-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      STACK_PREFIX: calibraq

    steps:
      - name: Instaliraj OCI CLI
        run: pip install --quiet oci-cli

      - name: Prekini ako instanca vec postoji
        run: |
          set -euo pipefail
          EXISTING=$(oci compute instance list \
            --compartment-id "$OCI_CLI_TENANCY" --all --output json \
            | jq -r '.data[] | select(.["lifecycle-state"] != "TERMINATED")
                     | "\(.["display-name"]) [\(.["lifecycle-state"])]"')
          if [ -n "$EXISTING" ]; then
            echo "Instanca vec postoji, nista se ne pokrece:"
            echo "$EXISTING"
            echo "STOP=1" >> "$GITHUB_ENV"
          else
            echo "Nema aktivnih instanci - nastavljam."
            echo "STOP=0" >> "$GITHUB_ENV"
          fi

      - name: Pokusaj apply na jednom stack-u
        if: env.STOP == '0'
        run: |
          set -euo pipefail

          mapfile -t STACKS < <(oci resource-manager stack list \
            --compartment-id "$OCI_CLI_TENANCY" --lifecycle-state ACTIVE --all --output json \
            | jq -r --arg p "$STACK_PREFIX" \
                '.data[] | select(.["display-name"] | startswith($p)) | .id' | sort)

          COUNT=${#STACKS[@]}
          if [ "$COUNT" -eq 0 ]; then
            echo "Nije pronadjen nijedan stack sa prefiksom '$STACK_PREFIX'."
            exit 1
          fi

          # Rotacija: svako pokretanje uzima sledeci stack po redu.
          IDX=$(( ${GITHUB_RUN_NUMBER:-0} % COUNT ))
          STACK="${STACKS[$IDX]}"
          NAME=$(oci resource-manager stack get --stack-id "$STACK" \
                 --query 'data."display-name"' --raw-output)

          echo "Stack $((IDX + 1))/$COUNT: $NAME"

          JOB_ID=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK" \
            --execution-plan-strategy AUTO_APPROVED \
            --query 'data.id' --raw-output)
          echo "Job: $JOB_ID"

          # Sami pratimo stanje - oci --wait pise poruke na stderr i kvari JSON.
          STATE=UNKNOWN
          for _ in $(seq 1 40); do
            STATE=$(oci resource-manager job get --job-id "$JOB_ID" \
                    --query 'data."lifecycle-state"' --raw-output)
            case "$STATE" in
              SUCCEEDED|FAILED|CANCELED) break ;;
            esac
            sleep 15
          done
          echo "Ishod: $STATE"

          if [ "$STATE" = "FAILED" ]; then
            oci resource-manager job get-job-logs --job-id "$JOB_ID" --output json 2>/dev/null \
              | jq -r '.data[]?.message // empty' | grep -iE "error|capacity" | tail -3 || true
          fi

          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "USPELO! Instanca je kreirana preko stack-a: $NAME"
            oci compute instance list --compartment-id "$OCI_CLI_TENANCY" --all \
              --query 'data[].{ime:"display-name",stanje:"lifecycle-state"}' --output table
            # Namerni fail: GitHub podrazumevano salje mejl samo za NEUSPESNE
            # workflow-e, pa je ovo najlaksi nacin da odmah dobijes obavestenje.
            # Ako ti to smeta, obrisi sledecu liniju.
            exit 1
          fi

          echo "Nema kapaciteta - sledeci pokusaj po rasporedu."
